server:
  port: ${SERVER_PORT:8487}

spring:
  application:
    name: erp-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 连接信息与口令均可用环境变量覆盖，生产环境不要把口令写进配置文件
    url: ${DB_URL:jdbc:mysql://localhost:3306/erp?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:your_password}
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  header: Authorization
  token-prefix: "Bearer "
  # 生产环境必须用 JWT_SECRET 环境变量覆盖默认密钥
  secret: ${JWT_SECRET:erp-management-system-default-jwt-secret-key-2026}
  expire-hours: 24
  refresh-expire-days: 7
  # 登录失败锁定策略
  max-login-fail-count: 5
  lock-minutes: 15
  # 密码策略
  password-min-length: 8
  password-expire-days: 90
  password-require-complexity: true

springdoc:
  swagger-ui:
    path: /doc.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs








