services:
  mysql:
    image: mysql:8.0
    container_name: erp-mysql
    environment:
      MYSQL_DATABASE: erp
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    ports:
      - "3306:3306"
    volumes:
      - erp-mysqldata:/var/lib/mysql
  redis:
    image: redis:7
    container_name: erp-redis
    ports:
      - "6379:6379"
    volumes:
      - erp-redisdata:/data

volumes:
  erp-mysqldata:
  erp-redisdata:








